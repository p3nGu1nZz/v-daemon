# v-daemon runtime settings (TOML)

[paths]
run = "run"
logs = "logs"

[pid_files]
daemon = "run/v-daemon.pid"
supervisor = "run/v-daemon-supervisor.pid"
director = "run/v-director.pid"

[logs]
daemon = "logs/daemon.log"
supervisor = "logs/supervisor.log"
director = "logs/director.log"

[runtime]
# Heartbeat interval for the daemon in seconds
heartbeat_interval_seconds = 30

[director]
# Whether the director may attempt safe, sandboxed execution of small patches (default false)
allow_execute = false
# Branch prefix to use for sandbox branches created by the patcher
sandbox_branch_prefix = "director/sandbox-"
# Run interval for the director's autopilot cycles (seconds)
interval_seconds = 60
